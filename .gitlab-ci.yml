include:
  - project: mdapi/ci-templates
    file: /buildkit-before-script.yml   # .zot-target: where this pipeline publishes
    ref: main
  - project: mdapi/ci-templates
    file: /secret-scan.yml
    ref: main
  - project: mdapi/ci-templates
    file: /scan.yml
    ref: main

stages:
  - build
  - scan

secret-scan:
  extends: .secret-scan

# HORIZON_VERSION has ONE home, the Dockerfile's `ARG HORIZON_VERSION=` (Renovate moves it); every
# job that tags or mirrors reads it from there. A CI variable used to override the ARG, so a bump
# of the Dockerfile alone built the old Horizon under the old tag.
# Every build also gets an IMMUTABLE tag (<version>-b<pipeline iid>). Deployments pin that tag,
# so a rollout is always an explicit tag bump in fleet and a rollback is the previous tag —
# rebuilding the same Horizon version can never silently change what the cluster runs.
.horizon-version:
  script:
    - HORIZON_VERSION="$(sed -n 's/^ARG HORIZON_VERSION=//p' Dockerfile)"
    - test -n "$HORIZON_VERSION"
    - BUILD_TAG="$HORIZON_VERSION-b$CI_PIPELINE_IID"

# The image build's provided-jar check (check-provided-jars.sh), tested on its own: the build
# runs it only against the real image, so a broken check would pass every build.
test:
  stage: build
  image: ${CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX}/library/alpine:3
  tags:
    - mdapi
  rules:
    - when: on_success
  script:
    - sh tests/check-provided-jars.test.sh

# Builds the patched Horizon image. Requires CI/CD variables:
#   EVERTRUST_REGISTRY_USER / EVERTRUST_REGISTRY_PASSWORD  (pull registry.evertrust.io base image)
# CI_JOB_TOKEN is passed as a buildkit secret so the in-image Maven build can read
# ch.tillo.tink:tink-ciphertrust from project 212's package registry.
buildkit:
  image:
    name: ${CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX}/moby/buildkit:rootless
    entrypoint: [""]
  stage: build
  tags:
    - mdapi
  # In the MERGE-REQUEST pipeline too: that is the pipeline GitLab gates a merge on, and a job
  # without `rules:` never runs there. Without this the Horizon 2.12.0 bump (!9) merged green
  # while its branch pipeline failed check-provided-jars.sh, and main's scheduled rebuild then
  # failed every 4h from 2026-11-03 17:33 (GitlabImageBuilderScheduledBuildFailing).
  rules:
    - when: on_success
  variables:
    BUILDKITD_FLAGS: --oci-worker-no-process-sandbox
  before_script:
    # GitLab's registry is read-only (infra-8f4.54): publish to zot only.
    # .zot-target picks mdapi/horizon-ciphertrust (main, ci-push) or
    # mdapi-dev/horizon-ciphertrust (any other ref, dev-push).
    - !reference [.zot-target, script]
    - test -n "$ZOT_IMAGE"
    - CACHE_IMAGE="$ZOT_IMAGE:cache"
    - mkdir -p ~/.docker
    - |
      echo "{
        \"auths\": {
          \"zot.mdapi.ch\": {
            \"auth\": \"$(printf "%s:%s" "${ZOT_PUSH_USER}" "${ZOT_PUSH_PASSWORD}" | base64 | tr -d '\n')\"
          },
          \"${CI_REGISTRY}\": {
            \"auth\": \"$(printf "%s:%s" "${CI_REGISTRY_USER}" "${CI_REGISTRY_PASSWORD}" | base64 | tr -d '\n')\"
          },
          \"registry.evertrust.io\": {
            \"auth\": \"$(printf "%s:%s" "${EVERTRUST_REGISTRY_USER}" "${EVERTRUST_REGISTRY_PASSWORD}" | base64 | tr -d '\n')\"
          },
          \"$(echo -n $CI_DEPENDENCY_PROXY_SERVER | awk -F[:] '{print $1}')\": {
            \"auth\": \"$(printf "%s:%s" ${CI_DEPENDENCY_PROXY_USER} "${CI_DEPENDENCY_PROXY_PASSWORD}" | base64 | tr -d '\n')\"
          }
        }
      }" > ~/.docker/config.json
  script:
    - !reference [.horizon-version, script]
    - printf '%s' "$CI_JOB_TOKEN" > /tmp/ci_job_token
    # Only the default branch publishes the version, immutable and :latest tags; a branch
    # (a Renovate MR) builds and scans :SHA only, like mdapi/ci-templates build.yml.
    - |
      TAGS="$ZOT_IMAGE:$CI_COMMIT_SHORT_SHA"
      if [ "$CI_COMMIT_BRANCH" = "$CI_DEFAULT_BRANCH" ]; then
        TAGS="$TAGS,$ZOT_IMAGE:$HORIZON_VERSION,$ZOT_IMAGE:$BUILD_TAG,$ZOT_IMAGE:latest"
      fi
    - |
      buildctl-daemonless.sh build \
        --frontend dockerfile.v0 \
        --local context=. \
        --local dockerfile=. \
        --secret id=ci_job_token,src=/tmp/ci_job_token \
        --export-cache type=registry,ref=$CACHE_IMAGE \
        --import-cache type=registry,ref=$CACHE_IMAGE \
        --opt platform=linux/amd64 \
        --output type=image,\"name=$TAGS\",push=true

# CVE scan of the image this pipeline pushed (:$CI_COMMIT_SHORT_SHA) via the shared job in
# mdapi/ci-templates (scan.yml). The grype curator and DefectDojo both read grype-report.json
# from the newest successful job named `scan`; without one, this image was invisible to both.
scan:
  extends: .grype-scan
